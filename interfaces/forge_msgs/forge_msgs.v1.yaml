version: 1
package: forge_msgs
transport:
  format: arrow_record_batch
  row_count: single
  metadata_policy: no_required_schema_metadata
  notes:
    - Payloads are optimized for Dora and are represented as single-row Arrow RecordBatch values.
    - Message schemas do not include ROS-style Header, timestamp, or frame_id fields.
    - If timing or frame information is required, carry it in Dora event context, topic naming, node configuration, or an adapter layer.

conventions:
  numeric:
    joint_scalar: float64
    image_dimension: uint32
  joints:
    revolute:
      position: radians
      velocity: radians_per_second
      effort: newton_meter
    prismatic:
      position: meter
      velocity: meter_per_second
      effort: newton
  image:
    byte_order: little_endian
    compressed_formats:
      - jpeg
      - png
      - webp
    encodings:
      rgb8:
        channels: 3
        scalar: uint8
        bytes_per_pixel: 3
      bgr8:
        channels: 3
        scalar: uint8
        bytes_per_pixel: 3
      mono8:
        channels: 1
        scalar: uint8
        bytes_per_pixel: 1
      16UC1:
        channels: 1
        scalar: uint16
        bytes_per_pixel: 2
      32FC1:
        channels: 1
        scalar: float32
        bytes_per_pixel: 4

messages:
  JointState:
    purpose: Robot or simulator joint observation payload.
    row_count: single
    fields:
      name:
        arrow: list<utf8>
        required: true
        unique_items: true
        empty_allowed: false
      position:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
      velocity:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
      effort:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
    validation:
      - name must contain at least one item.
      - name items must be unique.
      - position, velocity, and effort must either be empty or have the same length as name.

  JointCommand:
    purpose: Joint command payload for robot drivers and controllers.
    row_count: single
    fields:
      name:
        arrow: list<utf8>
        required: true
        unique_items: true
        empty_allowed: false
      position:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
      velocity:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
      effort:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
      kp:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
      kd:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
    validation:
      - name must contain at least one item.
      - name items must be unique.
      - position, velocity, effort, kp, and kd must either be empty or have the same length as name.
    mapping_notes:
      unitree_low_level:
        q: position
        dq: velocity
        tau: effort
        kp: kp
        kd: kd

  Image:
    purpose: Uncompressed image payload.
    row_count: single
    fields:
      height:
        arrow: uint32
        required: true
        minimum: 0
      width:
        arrow: uint32
        required: true
        minimum: 0
      encoding:
        arrow: utf8
        required: true
        allowed_values:
          - rgb8
          - bgr8
          - mono8
          - 16UC1
          - 32FC1
      step:
        arrow: uint32
        required: true
        description: Full row length in bytes. May be larger than width * bytes_per_pixel because of row padding.
      data:
        arrow: large_binary
        required: true
        length: step_times_height
    validation:
      - data length must equal step * height.
      - step must be at least width * bytes_per_pixel for known encodings.
      - Multi-byte pixel encodings use little-endian byte order.
      - Compressed jpeg, png, or webp payloads must use CompressedImage instead.

  CompressedImage:
    purpose: Compressed image bitstream payload.
    row_count: single
    fields:
      format:
        arrow: utf8
        required: true
        recommended_values:
          - jpeg
          - png
          - webp
      data:
        arrow: large_binary
        required: true
    validation:
      - data may be empty only for an empty image payload.
