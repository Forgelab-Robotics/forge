version: 1
package: forge_msgs
domain: sensor

messages:
  AudioChunk:
    purpose: Uncompressed audio buffer payload for streaming microphone or audio sources.
    row_count: single
    fields:
      sample_rate:
        arrow: uint32
        required: true
        unit: hertz
      channels:
        arrow: uint32
        required: true
      sample_format:
        arrow: utf8
        required: true
        allowed_values:
          - f32le
          - s16le
      frame_count:
        arrow: uint32
        required: true
        description: Number of audio frames per channel in this chunk.
      data:
        arrow: large_binary
        required: true
    validation:
      - sample_rate must be greater than 0.
      - channels must be greater than 0.
      - data length must equal frame_count * channels * bytes_per_sample for known sample_format values.
      - Multi-channel audio is interleaved by frame, e.g. frame0_ch0, frame0_ch1, frame1_ch0.
      - Multi-byte sample formats use little-endian byte order.
    notes:
      - f32le is little-endian float32 PCM. Producers should use normalized sample values in [-1.0, 1.0].
      - s16le is little-endian signed int16 PCM.

  Image:
    purpose: Uncompressed image payload.
    row_count: single
    fields:
      height:
        arrow: uint32
        required: true
        minimum: 0
      width:
        arrow: uint32
        required: true
        minimum: 0
      encoding:
        arrow: utf8
        required: true
        allowed_values:
          - rgb8
          - bgr8
          - mono8
          - 8UC1
          - 16UC1
          - 32SC1
          - 32FC1
      step:
        arrow: uint32
        required: true
        description: Full row length in bytes. May be larger than width * bytes_per_pixel because of row padding.
      data:
        arrow: large_binary
        required: true
        length: step_times_height
    validation:
      - data length must equal step * height.
      - step must be at least width * bytes_per_pixel for known encodings.
      - Multi-byte pixel encodings use little-endian byte order.
      - Compressed jpeg, png, or webp payloads must use CompressedImage instead.

  CompressedImage:
    purpose: Compressed image bitstream payload.
    row_count: single
    fields:
      format:
        arrow: utf8
        required: true
        recommended_values:
          - jpeg
          - png
          - webp
      data:
        arrow: large_binary
        required: true
    validation:
      - data may be empty only for an empty image payload.

  PointCloud:
    purpose: Organized or unorganized XYZ point cloud with common optional attributes.
    row_count: single
    fields:
      width:
        arrow: uint32
        required: true
      height:
        arrow: uint32
        required: true
      is_dense:
        arrow: bool
        required: true
      x:
        arrow: list<float32>
        required: true
      y:
        arrow: list<float32>
        required: true
      z:
        arrow: list<float32>
        required: true
      intensity:
        arrow: list<float32>
        required: true
        empty_allowed: true
        length: x_or_empty
      red:
        arrow: list<uint8>
        required: true
        empty_allowed: true
        length: x_or_empty
      green:
        arrow: list<uint8>
        required: true
        empty_allowed: true
        length: x_or_empty
      blue:
        arrow: list<uint8>
        required: true
        empty_allowed: true
        length: x_or_empty
    validation:
      - The serialized RecordBatch must contain exactly one row.
      - Required scalar and list cells must not be null, and list items must not be null.
      - x, y, and z must have the same length.
      - width * height must equal the point count.
      - Unorganized point clouds use height=1 and width equal to the point count.
      - Organized points are flattened in row-major order using index = row * width + column.
      - intensity, red, green, and blue must be empty or have the same length as x.
      - red, green, and blue must all be empty or all be populated.
      - If is_dense is true, x, y, and z must contain only finite values.
    notes:
      - Canonical writers use the declared field order, mark every top-level field non-nullable, and serialize unavailable optional attributes as present empty lists.
      - Readers resolve required fields by name, require exact physical Arrow types, and may accept reordered or additional fields.
      - XYZ coordinates use meters.
      - Arrow list offsets are signed 32-bit integers, so serialized point counts cannot exceed 2147483647.
      - Canonical producers should represent an invalid organized slot with NaN in all three XYZ components and set is_dense=false; readers treat any non-finite XYZ component as invalid.
      - is_dense=false does not require the cloud to contain an invalid point.
      - High-level constructors may infer unorganized clouds with height=1, width equal to the point count, and is_dense from finite XYZ values; serialized Arrow payloads still include width, height, and is_dense columns.
      - The coordinate frame is supplied by Dora metadata or node configuration, and timing comes from the Dora event context.
      - PointCloud v1 is the normalized Forge representation; layout-preserving decoded point records use PointCloudBuffer.

  PointCloudBuffer:
    purpose: Layout-preserving buffer of decoded Cartesian point records with dynamic fixed-width attributes and explicit point and row strides.
    row_count: single
    fields:
      width:
        arrow: uint32
        required: true
      height:
        arrow: uint32
        required: true
      is_dense:
        arrow: bool
        required: true
      byte_order:
        arrow: utf8
        required: true
        allowed_values:
          - little_endian
          - big_endian
      point_stride:
        arrow: uint32
        required: true
        description: Full byte stride between adjacent point records, including point padding.
      row_stride:
        arrow: uint64
        required: true
        description: Full byte stride between adjacent organized rows, including row padding.
      fields:
        arrow: "list<struct<name: utf8, offset: uint32, datatype: utf8, count: uint32>>"
        required: true
        empty_allowed: false
      data:
        arrow: large_binary
        required: true
    validation:
      - The serialized RecordBatch must contain exactly one row.
      - Required scalar, list, struct, and binary cells must not be null, and list and struct children must not be null.
      - height must be greater than 0. If width is 0, height must be 1, row_stride must be 0, and data must be empty.
      - point_stride must be greater than 0, including for an empty cloud because it describes the declared record layout.
      - width * height, width * point_stride, row_stride * height, and every field end offset must use checked arithmetic.
      - row_stride must be at least width * point_stride and data length must equal row_stride * height.
      - Field names must be non-empty and unique; count must be greater than 0.
      - datatype must be one of int8, uint8, int16, uint16, int32, uint32, int64, uint64, float32, or float64.
      - For every field, offset + datatype_size * count must not exceed point_stride.
      - Declared field byte ranges must not overlap. Point and row padding are allowed.
      - Exactly one scalar x, y, and z field must be present. They must all use float32 or all use float64 and coordinates use meters.
      - If is_dense is true, every decoded x, y, and z component must be finite.
    notes:
      - Canonical writers use the declared top-level field order, mark every top-level field non-nullable, and sort field descriptors by offset and then name. The fields list item metadata is nullable and its struct children are non-nullable, while actual null list items or struct children are invalid. Readers resolve top-level fields by name, require exact physical Arrow types, and may accept reordered or additional top-level fields.
      - Unorganized clouds use height=1 and width equal to the point count. Organized records use row-major order with byte offset row * row_stride + column * point_stride.
      - Canonical writers use little_endian. Readers use byte_order explicitly and must not assume native byte order or aligned field offsets.
      - PointCloudBuffer contains decoded Cartesian point records, not raw device packets. It does not imply whether points are calibrated, filtered, deskewed, transformed, or registered; the producer and consumer endpoint contract defines that processing stage.
      - intensity is an optional producer-defined scalar field whose quantity and scale must be documented by the producer.
      - time_offset_ns is the recommended name for an optional scalar uint32 offset relative to the Dora source event time. ring is the recommended name for an optional scalar uint16 laser channel index. These fields are conventions, not required fields.
      - Device-specific fixed-width fields such as reflectivity, line, tag, return_type, or ambient may be retained as additional descriptors.
      - Use normalized PointCloud when dynamic layout, per-point timing, and additional attributes no longer need to be preserved across the node boundary.

  Imu:
    purpose: SI-unit inertial measurement sample with optional orientation, optional covariance matrices, and optional temperature.
    row_count: single
    fields:
      orientation:
        arrow: "struct<qx: float64, qy: float64, qz: float64, qw: float64>"
        required: false
        nullable: true
      angular_velocity:
        arrow: "struct<x: float64, y: float64, z: float64>"
        required: true
        unit: radian_per_second
      linear_acceleration:
        arrow: "struct<x: float64, y: float64, z: float64>"
        required: true
        unit: meter_per_second_squared
      orientation_covariance:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: 9_or_empty
      angular_velocity_covariance:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: 9_or_empty
      linear_acceleration_covariance:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: 9_or_empty
      temperature_celsius:
        arrow: float64
        required: false
        nullable: true
        unit: degree_celsius
    validation:
      - The serialized RecordBatch must contain exactly one row.
      - angular_velocity and linear_acceleration structs and all of their children must not be null and must contain finite values.
      - orientation is null when unavailable. When present, all children must be non-null and finite, and qx, qy, qz, and qw must not all be zero.
      - Implementations must not silently normalize quaternion values.
      - Each covariance list must be empty when unavailable or contain exactly 9 finite float64 values in row-major order. Its diagonal values must be non-negative.
      - orientation_covariance must be empty when orientation is null.
      - temperature_celsius is null when unavailable and finite when present.
    notes:
      - Canonical covariance list item metadata is nullable, while actual null covariance items are invalid. Orientation and vector struct children are non-nullable.
      - Orientation uses named qx, qy, qz, and qw components so adapters must explicitly convert vendor array order. Euler roll, pitch, and yaw are intentionally omitted because they are derivable and may disagree with the quaternion.
      - Orientation covariance is a 3x3 local small-angle covariance over rotations about X, Y, and Z, not a 4x4 quaternion covariance. Angular-velocity and linear-acceleration covariance axes are X, Y, and Z.
      - Covariance positive-semidefiniteness is not validated by the wire message beyond finite values and non-negative diagonal entries.
      - Timing comes from the Dora event context. Sensor frame, mounting calibration, gravity convention, and device identity live in Dora metadata, stable node configuration, or the adapter layer.
