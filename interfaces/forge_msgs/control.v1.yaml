version: 1
package: forge_msgs
domain: control

messages:
  JointState:
    purpose: Robot or simulator joint observation payload.
    row_count: single
    fields:
      name:
        arrow: list<utf8>
        required: true
        unique_items: true
        empty_allowed: false
      position:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
      velocity:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
      effort:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
    validation:
      - name must contain at least one item.
      - name items must be unique.
      - position, velocity, and effort must either be empty or have the same length as name.

  JointCommand:
    purpose: Joint command payload for robot drivers and controllers.
    row_count: single
    fields:
      name:
        arrow: list<utf8>
        required: true
        unique_items: true
        empty_allowed: false
      mode:
        arrow: utf8
        required: false
        default: position
        allowed_values:
          - position
          - velocity
          - effort
          - hybrid
        compatibility: Payloads written before mode existed may omit this field; readers must treat a missing or null mode as position.
      position:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
      velocity:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
      effort:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
      kp:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
      kd:
        arrow: list<float64>
        required: true
        empty_allowed: true
        length: name_or_empty
    validation:
      - name must contain at least one item.
      - name items must be unique.
      - mode, when present, must be one of position, velocity, effort, or hybrid.
      - position, velocity, effort, kp, and kd must either be empty or have the same length as name.
    mapping_notes:
      control_modes:
        position: Position command interface.
        velocity: Velocity command interface.
        effort: Effort command interface.
        hybrid: Low-level position/velocity/effort command with optional kp/kd gains.
      unitree_low_level:
        q: position
        dq: velocity
        tau: effort
        kp: kp
        kd: kd

  LocomotionCommand:
    purpose: Planar body-frame locomotion velocity command for ground robots.
    row_count: single
    fields:
      vx:
        arrow: float64
        required: true
        unit: meter_per_second
        frame: robot_body
        sign_convention: positive_forward
      vy:
        arrow: float64
        required: true
        unit: meter_per_second
        frame: robot_body
        sign_convention: positive_left
      wz:
        arrow: float64
        required: true
        unit: radian_per_second
        frame: robot_body
        sign_convention: positive_counter_clockwise_about_z
        ros2_mapping: geometry_msgs/Twist.angular.z
    validation:
      - vx, vy, and wz must be finite float64 values.
    notes:
      - This message covers the common ground robot cmd_vel semantics linear.x, linear.y, and angular.z without adopting cmd_vel as a Forge input name.
      - Stop is represented by vx=0, vy=0, and wz=0.
      - The message intentionally has no mode, duration, gait, body height, frame_id, timestamp, linear_z, angular_x, or angular_y fields.

  PolicyCommand:
    purpose: Command payload sent from gateway to policy through Dora.
    row_count: single
    delivery_topic: policy_command
    fields:
      policy_id:
        arrow: utf8
        required: true
        empty_allowed: false
        description: Target policy instance id. Use "default" for single-policy setups.
      command:
        arrow: utf8
        required: true
        empty_allowed: false
        naming: snake_case
        recommended_values:
          - load
          - start
          - stop
          - pause
          - resume
          - reset
          - start_recording
          - stop_recording
          - load_playback
          - start_playback
          - pause_playback
          - resume_playback
          - reset_playback
          - seek_playback
          - set_playback_rate
      request_id:
        arrow: utf8
        required: true
        empty_allowed: true
        description: Optional correlation id for PolicyCommandStatus.
      inputs_json:
        arrow: utf8
        required: true
        empty_allowed: false
        default: "{}"
        json_type: object
    validation:
      - policy_id must be non-empty.
      - command must be non-empty and use snake_case.
      - request_id may be empty when no response is expected.
      - inputs_json must parse as a JSON object.
      - A PolicyCommandStatus response is optional.

  PolicyCommandStatus:
    purpose: Optional status payload sent from policy to gateway through Dora.
    row_count: single
    delivery_topic: policy_command_status
    optional_response: true
    fields:
      policy_id:
        arrow: utf8
        required: true
        empty_allowed: false
        description: Policy instance id that handled the command.
      command:
        arrow: utf8
        required: true
        empty_allowed: false
        description: Command name copied from PolicyCommand.
      request_id:
        arrow: utf8
        required: true
        empty_allowed: true
        description: Correlation id copied from PolicyCommand when present.
      status:
        arrow: utf8
        required: true
        empty_allowed: false
        allowed_values:
          - accepted
          - rejected
          - running
          - done
          - error
      message:
        arrow: utf8
        required: true
        empty_allowed: true
        description: Human-readable status text.
      outputs_json:
        arrow: utf8
        required: true
        empty_allowed: false
        default: "{}"
        json_type: object
    validation:
      - policy_id must be non-empty.
      - command must be non-empty.
      - status must be one of accepted, rejected, running, done, or error.
      - outputs_json must parse as a JSON object.
      - This message is optional; policies may omit status output when no response is required.
