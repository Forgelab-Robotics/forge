[project]
name = "forge"
version = "1.0.0"
description = "Core message schemas and Dora node helpers for Forge robotics applications."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "X-ERA" }
]
dependencies = [
    "forge-common>=1.0.0,<2",
    "forge-msgs>=1.0.0,<2",
    "forge-policy>=1.0.0,<2",
    "forge-robot>=1.0.0,<2",
    "forge-tool>=0.1.0,<0.3",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0.2",
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/msgs",
    "packages/common",
    "packages/policy",
    "packages/robot",
    "packages/kinematics",
    "packages/tool",
]

[tool.uv.sources]
forge-common = { workspace = true }
forge-msgs = { workspace = true }
forge-policy = { workspace = true }
forge-robot = { workspace = true }
forge-kinematics = { workspace = true }
forge-tool = { workspace = true }

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/*.py" = ["E402"]
