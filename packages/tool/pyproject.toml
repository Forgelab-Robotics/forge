[project]
name = "forge-tool"
version = "0.2.0"
description = "Typed endpoint contracts for Forge query, action, and session tools."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "X-ERA" }
]
dependencies = []

[project.optional-dependencies]
dora = ["forge-msgs>=1.2.0,<2"]

[tool.uv.sources]
forge-msgs = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
