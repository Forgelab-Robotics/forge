[project]
name = "forge-msgs"
version = "0.1.0"
description = "Python message models and Arrow serialization for Forge robotics dataflows."
readme = "README.md"
authors = [
    { name = "X-ERA" }
]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.4.2",
    "pillow>=11.0.0",
    "pyarrow>=23.0.0",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
