[project]
name = "forge-robot"
version = "1.0.0"
description = "通用机器人驱动协议与抽象基类，供 forge_robots 各机器人实现复用。"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "X-ERA" }
]
dependencies = [
    "dora-rs==0.4.1",
    "forge-msgs>=1.0.0,<2",
]

[tool.uv.sources]
forge-msgs = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
