[project]
name = "forge-kinematics"
version = "1.0.0"
description = "Deterministic Pinocchio-based forward and inverse kinematics for Forge."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "X-ERA" }
]
dependencies = [
    "numpy>=2.0",
    "pin>=3.0,<5",
]

[project.optional-dependencies]
least-squares = [
    "scipy>=1.16,<2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
