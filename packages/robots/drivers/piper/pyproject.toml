[project]
name = "forge_robots_drivers_piper"
version = "0.1.0"
description = "Piper robot hardware driver"
readme = "README.md"
authors = [
    { name = "chipunderblade", email = "pfjhyyj@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "forge_common",
    "forge_robots_drivers_core",
    "piper-sdk>=0.6.1",
]

[tool.uv.sources]
forge_robots_drivers_core = { workspace = true }
forge_common = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
