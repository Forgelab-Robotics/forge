[project]
name = "forge-policy"
version = "2.0.0"
description = "Reusable policy node protocol and Dora runner for Forge robotics applications."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "X-ERA" }
]
dependencies = [
    "dora-rs==1.0.0",
    "forge-msgs>=2.0.0,<3",
]

[project.urls]
Repository = "https://gitlab.ex-ai.cn/PhyAgentOS/framework/forge"
Changelog = "https://gitlab.ex-ai.cn/PhyAgentOS/framework/forge/-/blob/master/CHANGELOG.md"
Issues = "https://gitlab.ex-ai.cn/PhyAgentOS/framework/forge/-/issues"

[tool.uv.sources]
forge-msgs = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
